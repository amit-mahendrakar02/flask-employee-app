<!DOCTYPE html>

<html> 
    <head> 
        <title>Employee Management System</title> 
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
    </head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <p>Welcome to our DevOps Demo Application</p>

    <h2>Employee Details</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Department</th>
        </tr>

        {% for employee in employees %}
        <tr>
            <td>{{ employee.id }}</td>
            <td>{{ employee.name }}</td>
            <td>{{ employee.role }}</td>
            <td>{{ employee.department }}</td>
        </tr>
        {% endfor %}

    </table>

    <p class="footer">
        Powered by Python Flask | DevOps Project
    </p>

</div>


</body> 
</html>
